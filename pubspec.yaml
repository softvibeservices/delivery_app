name: delivery_app
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.10.7

dependencies:
  flutter:
    sdk: flutter

  # ── Networking ──────────────────────────────────────────────────────────────
  dio: ^5.4.0

  # ── State management ────────────────────────────────────────────────────────
  provider: ^6.1.1

  # ── Storage ─────────────────────────────────────────────────────────────────
  shared_preferences: ^2.2.2
  flutter_secure_storage: ^9.0.0

  # ── Firebase (Group 7) ──────────────────────────────────────────────────────
  firebase_core: ^3.6.0
  firebase_messaging: ^15.1.3

  # ── Notifications ───────────────────────────────────────────────────────────
  flutter_local_notifications: ^17.0.0

  # ── Location & background ───────────────────────────────────────────────────
  geolocator: ^11.0.0
  permission_handler: ^11.2.0
  battery_plus: ^5.0.2
  flutter_background_service: ^5.0.5

  # ── Utilities ───────────────────────────────────────────────────────────────
  intl: ^0.18.1
  url_launcher: ^6.3.1
  cupertino_icons: ^1.0.8
  flutter_native_splash: ^2.3.10

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true

  assets:
    - assets/

# ── Flutter Native Splash ──────────────────────────────────────────────────────
flutter_native_splash:
  color: "#E0F2FE"
  image: assets/app_icon.png
  android: true
  android_gravity: center
  android_12:
    color: "#E0F2FE"
    image: assets/app_icon.png
  ios: true
  ios_content_mode: center
  web: false
  fullscreen: true
  info_plist_files:
    - 'ios/Runner/Info.plist'

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/app_icon.png"  # your logo file path
  min_sdk_android: 21
  adaptive_icon_background: "#FFFFFF"      # background color for adaptive icon
  adaptive_icon_foreground: "assets/app_icon.png"  # optional